; SPDX-License-Identifier: AGPL-3.0-or-later
; OpenMesh firmware — one codebase, four reference boards.
;
; Portable protocol core: lib/openmesh (C++17, no Arduino includes).
; Board HAL: src/hal/ (RadioLib + Arduino) and boards/<board>.cpp (pin maps, role defaults).
;
; Quick start:
;   pip install -U platformio
;   pio run -e t1000e            # build
;   pio run -e t1000e -t upload  # flash over USB (see firmware/README.md)
;   pio test -e native           # host unit tests (needs a host compiler; see firmware/ci/host_tests.sh)
;
; NOTE: the three nRF52 targets use the Meshtastic platform fork only for its board definitions
; (tracker-t1000-e, wiscore_rak4631, seeed_solar_node) and Adafruit nRF52 core. No Meshtastic
; application source is used; pin maps live in our own boards/*.cpp with sources cited in
; firmware/README.md and NOTICE.

[platformio]
default_envs = t1000e
lib_dir = lib
test_dir = test
boards_dir = boards/pio

[env]
extra_scripts = pre:extra_scripts/openmesh_nrf52.py
; The Adafruit nRF52 builder injects -std=gnu++11; the firmware and its digit separators
; require C++17 (the build_flags -std=gnu++17 must win).
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I${PROJECT_DIR}/boards
  -DOM_FW_VERSION=\"0.7.1\"
  ; RAM-constrained nRF52 targets: 16 peers / 16 stored envelopes instead of 64/48. The
  ; engine keeps the full 2048-entry dedup table; these two save enough SRAM for a healthy
  ; stack next to the SoftDevice. Host tests still build with the larger native limits.
  -DOM_PEER_CAPACITY=16
  -DOM_STORE_CAPACITY=16
  -Wall -Wextra
monitor_speed = 115200

; ---------------------------------------------------------------------------------------------
; Host unit tests (protocol codec, crypto, dedup, store, companion, engine, golden vectors).
; Requires a host C++ compiler: PlatformIO's native platform uses the system gcc/g++.
; Machines without one can still run the same tests with ./ci/host_tests.sh (zig or gcc).
; ---------------------------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
  ${env.build_flags}
  -DOM_USE_UNITY
  -DOM_DEDUP_CAPACITY=512
  -DOM_STORE_CAPACITY=8
  -DOM_PEER_CAPACITY=8
  -DOM_CHANNEL_CAPACITY=2
  -DOM_EVENT_QUEUE=4
  -DOM_OUTBOX_CAPACITY=4
  -DOM_APP_DEDUP_CAPACITY=8
lib_deps =

; Same tests, explicit vectors environment (kept separate so CI can run it as its own leg).
[env:native_vectors]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -DOM_TEST_VECTORS=1

; ---------------------------------------------------------------------------------------------
; Seeed SenseCAP T1000-E — nRF52840 + LR1110 + Airoha GNSS, tracker/client role.
; Pin source: /tmp/ref_boards/t1000e_variant.h (vendor Arduino variant) + Seeed OSHW repo.
; ---------------------------------------------------------------------------------------------
[env:t1000e]
platform = https://github.com/meshtastic/platform-nordicnrf52.git#1a2639a6b0f79b5df66bea3e3089f0d5285fdc63
board = tracker-t1000-e
framework = arduino
board_build.ldscript = ld/nrf52840_s140_v7.ld
platform_packages =
  platformio/framework-cmsis@~2.60300.0
  platformio/toolchain-gccarmnoneeabi@1.100301.220327
  platformio/tool-adafruit-nrfutil@~1.503.0
  platformio/tool-bossac-nordicnrf52@1.10901.201022
build_src_filter = +<*> +<../boards> +<../variants/Seeed_T1000-E>
build_flags =
  ${env.build_flags}
  -Ivariants/Seeed_T1000-E
  -DUSE_S140_SOFTDEVICE
  -DOM_BOARD_T1000E
  -DOM_RADIO_LR1110=1
  -DOM_ENABLE_BLE=1
  -DUSE_TINYUSB
  -DOM_DEFAULT_REGION=\"EU868\"
lib_deps =
  jgromes/RadioLib@^7.2.0
upload_protocol = nrfutil
debug_tool = jlink

; First-article bring-up probe: USB CDC + LED only, no radio/BLE/storage. Not a product env.

; First-article diagnostic: full application with the BLE stack compiled out at runtime. Used for
; wired two-node/radio bring-up while the T1000-E USB/BLE coexistence issue is investigated.
[env:t1000e_usb]
extends = env:t1000e
build_flags =
  ${env:t1000e.build_flags}
  -UOM_ENABLE_BLE
  -DOM_ENABLE_BLE=0

[env:t1000e_probe]
extends = env:t1000e
build_src_filter = +<../probe/> +<../variants/Seeed_T1000-E>
build_flags =
  ${env:t1000e.build_flags}
  -DOM_ENABLE_BLE=0

; ---------------------------------------------------------------------------------------------
; RAK WisBlock 4631 in the RAK solar enclosure — nRF52840 + SX1262, repeater role.
; Pin source: /tmp/ref_boards/rak4631_variant.h + RAK4631 datasheet.
; ---------------------------------------------------------------------------------------------
[env:rak4631_solar]
platform = https://github.com/meshtastic/platform-nordicnrf52.git#1a2639a6b0f79b5df66bea3e3089f0d5285fdc63
board = wiscore_rak4631
framework = arduino
platform_packages =
  platformio/framework-cmsis@~2.60300.0
  platformio/toolchain-gccarmnoneeabi@1.100301.220327
  platformio/tool-adafruit-nrfutil@~1.503.0
  platformio/tool-bossac-nordicnrf52@1.10901.201022
; The RAK4631 ships the Adafruit/S140 6.1.1 bootloader; the board definition selects
; nrf52840_s140_v6.ld automatically.
build_src_filter = +<*> +<../boards> +<../variants/WisCore_RAK4631_Board>
build_flags =
  ${env.build_flags}
  -Ivariants/WisCore_RAK4631_Board
  -DUSE_S140_SOFTDEVICE
  -DOM_BOARD_RAK4631_SOLAR
  -DOM_ENABLE_BLE=1
  -DUSE_TINYUSB
  -DOM_DEFAULT_REGION=\"EU868\"
  ; RAK4631 v6 linker defaults to a 0x800-byte main stack; the full app needs more headroom.
  -Wl,--defsym=__StackSize=0x4000
lib_deps =
  jgromes/RadioLib@^7.2.0
upload_protocol = nrfutil
debug_tool = jlink

; First-article diagnostic: RAK application with BLE compiled out at runtime (USB/radio bring-up).
[env:rak4631_usb]
extends = env:rak4631_solar
build_flags =
  ${env:rak4631_solar.build_flags}
  -UOM_ENABLE_BLE
  -DOM_ENABLE_BLE=0

[env:rak4631_early]
extends = env:rak4631_usb
build_flags =
  ${env:rak4631_usb.build_flags}
  -DOM_EARLY_STOP=1

[env:rak4631_trace]
extends = env:rak4631_early
build_flags =
  ${env:rak4631_early.build_flags}
  -DOM_BOOT_TRACE=1

[env:rak4631_setupmark]
extends = env:rak4631_early

[env:rak4631_probe]
extends = env:rak4631_usb
build_src_filter = +<../probe/> +<../variants/WisCore_RAK4631_Board>
build_flags =
  ${env:rak4631_usb.build_flags}

; ---------------------------------------------------------------------------------------------
; Seeed SenseCAP Solar Node P1 — nRF52840 + SX1262 + L76KB GNSS, solar repeater/gateway.
; Pin source: /tmp/ref_boards/solar_variant.h + Seeed SenseCAP Solar Node documentation.
; ---------------------------------------------------------------------------------------------
[env:seeed_solar]
platform = https://github.com/meshtastic/platform-nordicnrf52.git#1a2639a6b0f79b5df66bea3e3089f0d5285fdc63
board = seeed_solar_node
framework = arduino
platform_packages =
  platformio/framework-cmsis@~2.60300.0
board_build.ldscript = ld/nrf52840_s140_v7.ld
build_src_filter = +<*> +<../boards> +<../variants/seeed_solar_node>
build_flags =
  ${env.build_flags}
  -Ivariants/seeed_solar_node
  -DUSE_S140_SOFTDEVICE
  -DOM_BOARD_SEEED_SOLAR
  -DOM_ENABLE_BLE=1
  -DUSE_TINYUSB
  -DOM_DEFAULT_REGION=\"EU868\"
lib_deps =
  jgromes/RadioLib@^7.2.0
upload_protocol = nrfutil
debug_tool = jlink

; ---------------------------------------------------------------------------------------------
; Heltec Wireless Tracker — ESP32-S3 + SX1262 + L76K/UC6580 GNSS + ST7735S TFT, tracker/client.
; Pin source: /tmp/ref_boards/hwt_variant.h + Heltec schematic.
; ---------------------------------------------------------------------------------------------
[env:heltec_tracker]
platform = espressif32@^6.9.0
board = heltec_wireless_tracker
framework = arduino
board_build.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DOM_BOARD_HELTEC_TRACKER
  -DOM_ENABLE_BLE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DOM_DEFAULT_REGION=\"EU868\"
lib_deps =
  jgromes/RadioLib@^7.2.0
  h2zero/NimBLE-Arduino@1.4.3
upload_protocol = esptool
