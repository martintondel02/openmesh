name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that OpenMesh makes hard today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Be concrete. If it touches the protocol, mention airtime cost.
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["protocol", "media", "clients", "firmware/hardware", "routing/scaling", "nomadnet/reticulum", "docs/tooling"]
    validations: { required: true }
