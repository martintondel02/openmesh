name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Simulator scenarios
        run: cargo run -p openmesh-sim -- --seed 42 --json

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm --dir apps/web install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: voice-wasm
      - name: Build Codec2 WASM (tiny voice)
        run: scripts/build-voice-wasm.sh
      - name: Type-check and build
        run: pnpm --dir apps/web build
      - name: Test
        run: pnpm --dir apps/web test -- --run

  protocol-vectors:
    name: protocol-vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate golden vectors and check for drift
        run: |
          cargo run -p openmesh-core --example gen_vectors
          git diff --exit-code -- protocol/vectors || \
            (echo "::error::protocol/vectors is out of date; run cargo run -p openmesh-core --example gen_vectors" && exit 1)

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify required documents exist and cross-links resolve
        run: python3 scripts/check_docs.py
      - name: Verify help corpus (embedded in bridge + web Help Center)
        run: python3 scripts/check_help.py
      - name: Verify OpenAPI documents every bridge route
        run: python3 scripts/check_openapi.py
