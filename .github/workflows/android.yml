name: Android

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "crates/openmesh-ffi/**"
      - "content/help/**"
      - "content/presets/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "crates/openmesh-ffi/**"
      - "content/help/**"
      - "content/presets/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  build:
    name: assemble-debug
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be referenced in step `if:` conditions; lift them to job env and test the env.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default `tools` package no longer exists in current SDK repos.
          packages: platform-tools

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ffi

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Build Rust FFI + UniFFI Kotlin bindings
        run: ./scripts/build-ffi.sh
        env:
          OPENMESH_ANDROID_ABIS: "arm64-v8a armeabi-v7a x86_64"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gradle local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Lint, unit tests and debug APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Build release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew --no-daemon assembleRelease
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build unsigned release APK (no signing secrets)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: openmesh-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: openmesh-android-release
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
