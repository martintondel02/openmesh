name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", "protocol/vectors/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "protocol/vectors/**"]
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [t1000e, rak4631_solar, seeed_solar, heltec_tracker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ matrix.env }}-${{ hashFiles('firmware/platformio.ini', 'firmware/src/**', 'firmware/lib/**') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -d firmware -e ${{ matrix.env }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openmesh-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/*.bin
            firmware/.pio/build/${{ matrix.env }}/*.uf2
            firmware/.pio/build/${{ matrix.env }}/*.zip
          if-no-files-found: warn

  native-tests:
    name: firmware-native-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Protocol conformance tests on host
        run: pio test -d firmware -e native
