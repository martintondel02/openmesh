[package]
name = "openmesh-bridge"
description = "OpenMesh local bridge daemon: transports, storage, WebSocket API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "openmesh_bridge"
path = "src/lib.rs"

[[bin]]
name = "openmesh-bridge"
path = "src/main.rs"

[dependencies]
openmesh-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
redb = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
# HTTP parsing for the hand-rolled loopback server (pure Rust; already transitively present).
http = "1"
httparse = "1"
sha2 = { workspace = true }
# HTTPS client for outbound gateway webhooks (rustls; no system OpenSSL required).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# SO_REUSEADDR/SO_REUSEPORT for the LAN transport (pure Rust).
socket2 = "0.6"
# Pure-Rust QR code generator for the backbone setup panel.
qrcodegen = "1"
# Hardware serial transport: opt-in only so the default build needs no libudev.
serialport = { workspace = true, optional = true }

[features]
default = []
real-serial = ["dep:serialport"]

[dev-dependencies]
tempfile = "3"
