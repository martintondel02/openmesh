# WireGuard — recommended way to run a backbone over the public internet without TLS wrapping.
#
# Server (backbone host) /etc/wireguard/wg0.conf:
#
#   [Interface]
#   Address = 10.44.0.1/24
#   ListenPort = 51820
#   PrivateKey = <server-private-key>
#
#   [Peer]
#   PublicKey = <gateway-a-public-key>
#   AllowedIPs = 10.44.0.2/32
#
#   [Peer]
#   PublicKey = <gateway-b-public-key>
#   AllowedIPs = 10.44.0.3/32
#
# Then bind the backbone to the WireGuard address and open only 51820/udp publicly:
#
#   backbone.json: { "bind": "10.44.0.1", "port": 9443, ... }
#   firewall: allow 51820/udp; do NOT open 9443 on the public interface.
#
# Gateway host (joining bridge) /etc/wireguard/wg0.conf:
#
#   [Interface]
#   Address = 10.44.0.2/24
#   PrivateKey = <gateway-a-private-key>
#
#   [Peer]
#   PublicKey = <server-public-key>
#   Endpoint = mesh.example.org:51820
#   AllowedIPs = 10.44.0.0/24
#   PersistentKeepalive = 25
#
# Join:
#   openmesh-bridge join 'openmesh://backbone?host=10.44.0.1&port=9443&token=...'
#
# Tailscale is an alternative: `tailscale up` on both hosts, bind the backbone to the
# Tailscale address (or leave 0.0.0.0 and firewall 9443 to the tailnet interface only), and join
# using the server's 100.x.y.z address. Use Tailscale ACLs to limit which nodes may reach it.
