# stunnel client — TLS wrapper for joining an OBB/1 backbone through nginx TLS termination.
#
# On each host that runs `openmesh-bridge join` over an untrusted network:
#   sudo install -m0644 stunnel-client.conf /etc/stunnel/openmesh.conf
#   sudo systemctl enable --now stunnel@openmesh
#   openmesh-bridge join 'openmesh://backbone?host=127.0.0.1&port=9444&token=...'
#
# The connection string must point at this local stunnel port (9444), not at the public TLS
# port. The token still authenticates the OBB/1 handshake end-to-end; TLS only protects the
# transport. WireGuard/Tailscale is simpler and preferred when available.

[openmesh-backbone]
client = yes
accept = 127.0.0.1:9444
connect = mesh.example.org:9443

; Verify the server certificate (recommended).
verifyChain = yes
checkHost = mesh.example.org
CAfile = /etc/ssl/certs/ca-certificates.crt

; Long-lived connection; the protocol reconnects with backoff if it drops.
TIMEOUTclose = 0
