# nginx — TLS + basic auth in front of the OpenMesh panel/API (127.0.0.1:8787).
#
# Install: copy to /etc/nginx/conf.d/openmesh-panel.conf, create the password file with
#   sudo htpasswd -c /etc/nginx/.htpasswd admin
# then `sudo nginx -t && sudo systemctl reload nginx`.
# Certificates: use certbot or your existing ACME setup; paths below are certbot defaults.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mesh.example.org;

    ssl_certificate     /etc/letsencrypt/live/mesh.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mesh.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    auth_basic "OpenMesh panel";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# Optional: redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mesh.example.org;
    return 301 https://$host$request_uri;
}
