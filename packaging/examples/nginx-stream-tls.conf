# nginx stream — TLS termination for the OBB/1 backbone port.
#
# IMPORTANT: `openmesh-bridge join` speaks plaintext OBB/1 in v0.2.0. There is no native TLS
# inside the protocol yet, so wrapping the port in TLS requires a client-side wrapper on every
# joining bridge host (see stunnel-client.conf) or a VPN (recommended: WireGuard/Tailscale).
#
# Topology:
#   client join -> 127.0.0.1:9444 (stunnel) -> TLS 9443 -> this nginx -> 127.0.0.1:9444 plain
#   backbone listener must be configured for port 9444 (backbone.json "port": 9444), NOT 9443.
#
# Requires the nginx stream module and ssl module (part of the standard nginx packages):
#   nginx -V 2>&1 | tr ' ' '\n' | grep stream
# Place this file at /etc/nginx/nginx.conf (or include it from the stream {} block).

stream {
    upstream openmesh_backbone {
        server 127.0.0.1:9444;
    }

    server {
        listen 9443 ssl;
        listen [::]:9443 ssl;
        server_name mesh.example.org;

        ssl_certificate     /etc/letsencrypt/live/mesh.example.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mesh.example.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_timeout 1h;

        proxy_pass openmesh_backbone;
        proxy_connect_timeout 10s;
        proxy_timeout 900s;   # longer than the OBB/1 90 s idle timeout
    }
}
