# Create the unprivileged system user used by packaging/systemd/openmesh-backbone.service.
#   sudo systemd-sysusers packaging/sysusers/openmesh.conf
# The home directory is only a placeholder; runtime state lives in /var/lib/openmesh via
# StateDirectory= and configuration in /etc/openmesh via ConfigurationDirectory=.
u openmesh - "OpenMesh backbone daemon" /var/lib/openmesh /usr/sbin/nologin
