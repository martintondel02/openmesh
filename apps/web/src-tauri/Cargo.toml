[package]
name = "openmesh-desktop"
version = "0.5.1"
description = "OpenMesh desktop client — LoRa mesh chat, map and media"
authors = ["OpenMesh contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-or-later"
repository = "https://github.com/martintondel02/openmesh"

[lib]
name = "openmesh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
